name: Skill emulator proof report
on:
  # Trusted default-branch code consumes strictly validated JSON, never PR code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ['Optional skill emulator runs']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: skill-emulator-report-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Inspect PR files and workflow path, validate summaries and report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -m tools.ci.emulator_report --run "$RUN_ID"
