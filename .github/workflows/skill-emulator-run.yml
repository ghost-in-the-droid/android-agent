name: Optional skill emulator runs
# PR execution has no user secrets or write token. Reporting is a separate workflow.
on:
  pull_request:
    paths: ['skillhub/**']
    types: [opened, synchronize, reopened, labeled, unlabeled]
concurrency:
  group: skill-emulator-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  API_LEVEL: '34'
  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64
  EMULATOR_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
jobs:
  submission:
    uses: ./.github/workflows/skill-submission.yml
    # A reusable workflow cannot exceed its caller's permissions: the callee's trust job
    # reads PR metadata and labels, so the caller grants exactly those read scopes.
    permissions:
      contents: read
      pull-requests: read
      issues: read
  plan:
    needs: submission
    if: needs.submission.outputs.allowed == 'true' && needs.submission.outputs.count != '0'
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Preserve trusted matrix helper
        run: |
          mkdir -p /tmp/skill-emulator-plan/tools
          cp -r tools/ci /tmp/skill-emulator-plan/tools/ci
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: plan
        env:
          CHANGED_MATRIX: ${{ needs.submission.outputs.matrix }}
        run: |
          cd /tmp/skill-emulator-plan
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          from tools.ci.emulator_actions import matrix
          paths = [p + '/skill.yaml' for p in json.loads(os.environ['CHANGED_MATRIX'])['skill']]
          result = matrix(paths, Path(os.environ['GITHUB_WORKSPACE']))
          print('matrix=' + json.dumps(result))
          print('count=' + str(len(result['skill'])))
          PYTHON
  emulator:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: emulator (${{ matrix.skill }})
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SKILL_PATH: ${{ matrix.skill }}
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # runner.* is not available in jobs.<id>.env, so export the temp paths from a step.
      - name: Export per-run output paths
        run: |
          echo "EMULATOR_OUTPUT=$RUNNER_TEMP/skill-emulator-output" >> "$GITHUB_ENV"
          echo "GHOST_CONFIG_DIR=$RUNNER_TEMP/skill-emulator-key" >> "$GITHUB_ENV"
      - name: Preserve trusted action helper
        run: |
          mkdir -p /tmp/skill-emulator/tools
          cp -r tools/ci /tmp/skill-emulator/tools/ci
          cp scripts/ci/phone_smoke.sh /tmp/skill-emulator/phone_smoke.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ghost
        run: python3 -m pip install -e '.[test]'
      - name: AVD cache
        id: avd-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-${{ env.EMULATOR_PROFILE }}-v2
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: bash /tmp/skill-emulator/phone_smoke.sh --settle-only
      - name: Test and record skill actions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          emulator-port: 5554
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: bash /tmp/skill-emulator/phone_smoke.sh --settle-only && PYTHONPATH=/tmp/skill-emulator:. python3 /tmp/skill-emulator/tools/ci/emulator_actions.py --skill "$SKILL_PATH" --output "$EMULATOR_OUTPUT"
      - name: Upload videos and integrity-signed run records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-emulator-media-${{ strategy.job-index }}
          path: |
            ${{ env.EMULATOR_OUTPUT }}/*.mp4
            ${{ env.EMULATOR_OUTPUT }}/runs/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload bounded reporting data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-emulator-result-${{ strategy.job-index }}
          path: ${{ env.EMULATOR_OUTPUT }}/result.json
          if-no-files-found: warn
          retention-days: 14
  proof:
    name: skill-emulator-proof
    needs: [submission, plan, emulator]
    if: always()
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 2
    steps:
      - name: Fail closed on gate or action failures
        env:
          SUBMISSION_RESULT: ${{ needs.submission.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          EMULATOR_RESULT: ${{ needs.emulator.result }}
          COUNT: ${{ needs.submission.outputs.count }}
        run: |
          # COUNT comes from the submission detect job, never defaulted: an empty value means
          # detect did not run or failed, which fails closed. Zero means the PR touches no skill
          # directory (platform or docs change) and there is nothing to prove.
          if [ -z "$COUNT" ]; then echo "::error::no skill count from submission detect"; exit 1; fi
          if [ "$COUNT" = 0 ]; then exit 0; fi
          if [ "$SUBMISSION_RESULT" != success ] || [ "$PLAN_RESULT" != success ]; then exit 1; fi
          test "$EMULATOR_RESULT" = success
