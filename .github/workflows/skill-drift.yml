name: Skill fingerprint drift
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Print drift candidates without writing issues'
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
concurrency:
  group: skillhub-drift
  cancel-in-progress: false
jobs:
  drift:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Play Store reader
        run: npm install --prefix /tmp/skill-drift google-play-scraper@10.1.3
      - name: Fetch one version per Android app package
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const {default: store} = await import('/tmp/skill-drift/node_modules/google-play-scraper/index.js');
          const registry = JSON.parse(fs.readFileSync('skillhub/registry.json', 'utf8'));
          const packages = new Set();
          for (const skill of Object.values(registry.skills)) {
            const fp = skill.versions[skill.latest].fingerprint;
            for (const fingerprint of Array.isArray(fp) ? fp : [fp]) {
              if (fingerprint && fingerprint.os === 'android' && fingerprint.app_package) packages.add(fingerprint.app_package);
            }
          }
          const versions = {};
          for (const appId of packages) {
            try { versions[appId] = (await store.app({appId})).version; }
            catch (error) { console.warn(`Could not check ${appId}: ${error.message}`); }
          }
          fs.writeFileSync('play-versions.json', JSON.stringify(versions));
          JS
      - name: Compare ranges and update drift issues
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 -m tools.ci.drift --versions play-versions.json "${args[@]}"
