name: Phone smoke

# Tier-1 phone CI: boots a throwaway Android emulator on a GitHub-hosted runner
# (KVM-accelerated) and runs Ghost hard-skill smoke tests against it.
#
# One matrix job per skill. A "skill" is any tests/phone/test_<skill>.py file —
# adding a file adds a job, no workflow edit needed. See docs/CI_PHONE_SETUP.md.
#
# Cost guards: PRs only when phone-relevant
# paths change and the PR is not a draft; manual dispatch otherwise. Never on push.

on:
  pull_request:
    branches: [main, master, "rc/**"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "gitd/bots/common/**"
      - "gitd/skills/__init__.py"
      - "gitd/skills/base.py"
      - "gitd/skills/locations.py"
      - "gitd/skills/_base/**"
      - "tests/phone/**"
      - "scripts/ci/phone_smoke.sh"
      - ".github/workflows/phone-smoke.yml"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      skills:
        description: "Comma-separated skills to run (e.g. tap_smoke,type_smoke). Blank = all tests/phone/test_*.py"
        required: false
        default: ""
      api-level:
        description: "Android API level of the emulator image"
        required: false
        default: "34"

permissions:
  contents: read

concurrency:
  group: phone-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: ${{ inputs.api-level || '34' }}
  # google_apis x86_64 + pixel_6 (1080x2400) — the screen size tests/phone assumes.
  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64
  EMULATOR_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 2
    outputs:
      skills: ${{ steps.discover.outputs.skills }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: tests/phone
      - id: discover
        env:
          REQUESTED: ${{ inputs.skills }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, sys
          found = sorted(p.stem.removeprefix("test_") for p in pathlib.Path("tests/phone").glob("test_*.py"))
          wanted = [s.strip() for s in os.environ.get("REQUESTED", "").split(",") if s.strip()]
          unknown = sorted(set(wanted) - set(found))
          if unknown:
              sys.exit(f"::error::unknown skill(s) {unknown}; available: {found}")
          skills = wanted or found
          if not skills:
              sys.exit("::error::no tests/phone/test_*.py files found")
          print(f"skills={json.dumps(skills)}")
          print(f"::notice::phone-smoke skills: {', '.join(skills)}", file=sys.stderr)
          EOF

  smoke:
    needs: plan
    name: smoke (${{ matrix.skill }})
    # Pinned: emulator + KVM + system-image download are what break on a runner
    # image bump (ubuntu-latest moves to 26.04 from 2026-10-19). Bump deliberately.
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.plan.outputs.skills) }}
    env:
      PHONE_CI_ARTIFACTS: ${{ github.workspace }}/phone-ci-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # A cold AVD needs ~7.4 GB for its userdata partition. The ubuntu-24.04 image from 2026-11 leaves
      # ~6.8 GB on /, so the emulator exits FATAL at once and the runner reports a boot timeout 10 min later.
      # Drop toolchains this job never uses (the Android SDK, Python and Docker stay).
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/local/share/powershell /opt/microsoft
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Ghost
        run: pip install -e ".[test]"

      # Boot once with snapshot save on a cache miss; later runs on the same ref
      # restore it. Caches are ref-scoped and this workflow never runs on push, so
      # each PR builds its own (see "Cache scope" in docs/CI_PHONE_SETUP.md).
      - name: AVD cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-${{ env.EMULATOR_PROFILE }}-v3

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          # Let first-boot work finish before the snapshot is saved on shutdown.
          script: scripts/ci/phone_smoke.sh --settle-only

      - name: Run ${{ matrix.skill }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          # Each script line runs in its own `sh -c`, so keep it to one call.
          script: scripts/ci/phone_smoke.sh ${{ matrix.skill }}

      # cancelled() covers the 15-min timeout (GitHub marks timed-out jobs
      # cancelled), which is exactly when a hung emulator's artifacts matter.
      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-smoke-${{ matrix.skill }}-api${{ env.API_LEVEL }}
          path: ${{ env.PHONE_CI_ARTIFACTS }}
          if-no-files-found: warn
          retention-days: 14
