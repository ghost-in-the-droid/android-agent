# Where an APK used by CI, the emulator pool or a verifier may come from. Anything
# not matching one of these entries is refused. PLANNED: nothing installs APKs yet;
# CI only targets apps on the stock emulator image (docs/skillhub/security.md s5).
# Package-prefix trust is only meaningful together with these pinned sources.
apk_sources:
  fdroid:
    # Official F-Droid main repo. CI resolves the APK and its sha256 from the signed
    # index (index-v2.json) and refuses a download whose sha256 differs.
    index: https://f-droid.org/repo/index-v2.json
    url_pattern: "https://f-droid.org/repo/<package>_<versionCode>.apk"
    verify: sha256 from index-v2.json

  vendor_direct:
    # Vendor-operated download pages only. Each needs a pinned sha256 in the skill PR
    # (and the vendor's published signing-cert fingerprint where one exists).
    - vendor: Signal
      package: org.thoughtcrime.securesms
      url: https://signal.org/android/apk/
      notes: "Page publishes the SHA-256 fingerprint of the signing certificate; check it before install."
    - vendor: Telegram
      package: org.telegram.messenger
      url: https://telegram.org/dl/android/apk
      notes: "Redirects to Telegram's own CDN. The direct build can carry a different package id than the Play build; the installed id must match the skill fingerprint."
    - vendor: Mozilla (Firefox for Android)
      package: org.mozilla.firefox
      url: https://archive.mozilla.org/pub/fenix/releases/
      notes: "Current builds. GitHub releases at github.com/mozilla-mobile/firefox-android stop at fenix-v125.3.0 (2024-04-29) and are allowed only to pin that old version."
    - vendor: Termux
      package: com.termux
      url: https://github.com/termux/termux-app/releases
      notes: "GitHub builds are signed with a different key than F-Droid builds and cannot update each other; prefer the F-Droid source."

  forbidden:
    # Never allowed, whatever the PR says.
    - APKMirror (apkmirror.com)
    - APKPure (apkpure.com, apkpure.net)
    - Any other third-party APK mirror or aggregator
    - Arbitrary URLs supplied in a skill, a PR body or a comment
    - APKs committed to the repository
