# Ghost Skill Hub: trusted vendors and allowed APK sources (v1)
#
# Manually curated allowlist, maintainer-approved security model (docs/skillhub/security.md).
# Read by tools/ci/trusted_vendor.py (hub-ci). Change it only by PR; a maintainer
# approves every change. Package ids were checked against their live Google
# Play listing (HTTP 200 + listing title) on 2026-10-08.
#
# Matching rule for `prefix`: a skill's fingerprint.app_package matches when it is
# exactly the prefix or starts with the prefix followed by "." (com.whatsapp matches
# com.whatsapp and com.whatsapp.w4b, never com.whatsappx).
#
# Being listed here is ONE of three signals that make an app Tier 1 eligible; the
# others are "listed on F-Droid" and "vendor GitHub repo with >= 1000 stars and
# releases". It does not by itself make a skill auto-run: the skill must also be
# YAML-only (see docs/skillhub/security.md).

