    type: string
    required: true
    description: Exact bundled port name currently exposed by open_ports/scroll_ports
  steps:
  - python_action: helpers:select_port
  end_state_validator:
    all_of:
    - kind: custom_python
      function: helpers:tides_ok
  test_case:
