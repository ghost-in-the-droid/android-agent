  ref_prompt: Read tide events with NO parameters; safely opens default Auckland from
    Samsung HOME, otherwise requires NZ Tides foreground
  params: []
  steps:
  - python_action: helpers:read_tides
  end_state_validator:
    all_of:
    - kind: custom_python
      function: helpers:tides_ok
  test_case:
    ref_prompt_variants:
    - Read tide events with NO parameters; safely opens default Auckland from Samsung
      HOME, otherwise requires NZ Tides foreground
    expected_success: true
- name: open_ports
  description: Open the bundled public port picker and list exposed names
  ref_prompt: Open the bundled public port picker and list exposed names
  params: []
  steps:
  - python_action: helpers:open_ports
  end_state_validator:
    all_of:
    - kind: custom_python
      function: helpers:ports_ok
  test_case:
    ref_prompt_variants:
    - Open the bundled public port picker and list exposed names in nztides
    expected_success: true
- name: scroll_ports
  description: Scroll the open public port picker down or up
  ref_prompt: Scroll the open public port picker down or up
  params:
