# Ghost in the Droid: Linux Command Library (login-free FOSS seed skill, installed from F-Droid)
# Linux Command Library (F-Droid): an offline reference of thousands of Linux commands. Search a command, open its page and read the TLDR examples, synopsis, description and parameters. No account.

name: linux-command-library
version: 1.0.0
author: ghost
description: "Linux Command Library (F-Droid): an offline reference of thousands of Linux commands. Search a command, open its page and read the TLDR examples, synopsis, description and parameters. No account."
skill_class: hard
license: MIT
generated_with: "Claude Sonnet 5.5 via Claude Code, hand-explored on a real Samsung phone"
side_effects: [none]
destructive: false
tos_risk: low
locale: [en-GB]
data_access: []

fingerprint:
  os: android
  os_version: ">=13"
  hardware: "samsung/SM-A037F"
  app_package: com.inspiredandroid.linuxcommandbibliotheca
  app_version: ">=4.9"
  screen_wxh: 720x1600
  density: 300
  locale: en-GB

repo_url: "https://github.com/ghost-in-the-droid/android-agent"
skill_path: "skillhub/ghost/linux-command-library"

popup_detectors: []

subroutines:
  - name: open_app
    description: "Launch the app."
    steps:
      - {action: launch_app, package: com.inspiredandroid.linuxcommandbibliotheca}
      - {action: sleep, duration_s: 2.5}

actions:
  - name: open_library
    description: "Restart the app and read the start screen."
    ref_prompt: "Open the Linux command library"
    params: []
    steps:
      - python_action: "helpers:restart_app"
      - subroutine: open_app
      - python_action: "helpers:open_library"
    end_state_validator:
      all_of:
        - {kind: custom_python, function: "helpers:library_open"}
    test_case:
      ref_prompt_variants:
        - "open Linux Command Library"
      expected_success: true

  - name: search_commands
    description: "Search commands by name; returns the number of matches and the first result names."
    ref_prompt: "Search the Linux command library for tar"
    demo_params: {query: "tar"}
    params:
      - {name: query, type: str, required: true, description: "Command name or part of it, ASCII"}
    steps:
      - subroutine: open_app
      - python_action: "helpers:search_commands"
    end_state_validator:
      all_of:
        - {kind: custom_python, function: "helpers:searched"}
    test_case:
      ref_prompt_variants:
        - "find the grep command"
        - "which commands contain zip"
      expected_success: true

  - name: open_command
    description: "Open a command page by its exact name (searches for it first if needed) and list its sections."
    ref_prompt: "Open the tar command page"
    demo_params: {name: "tar"}
    params:
      - {name: name, type: str, required: true, description: "Exact command name, e.g. tar or grep"}
    steps:
      - subroutine: open_app
      - python_action: "helpers:open_command"
    end_state_validator:
      all_of:
        - {kind: custom_python, function: "helpers:command_open"}
    test_case:
      ref_prompt_variants:
        - "show me the man page of grep"
      expected_success: true

  - name: read_section
    description: "Read one section of the open command page: TLDR (default, example pairs), SYNOPSIS, DESCRIPTION, PARAMETERS, INSTALL, CAVEATS, HISTORY or SEE ALSO."
    ref_prompt: "Read the TLDR examples of the open command"
    demo_params: {section: "TLDR"}
    params:
      - {name: section, type: str, required: false, description: "Section header, default TLDR"}
    steps:
      - subroutine: open_app
      - python_action: "helpers:read_section"
    end_state_validator:
      all_of:
        - {kind: custom_python, function: "helpers:section_read"}
    test_case:
      ref_prompt_variants:
        - "what is the synopsis"
        - "read the description"
      expected_success: true

  - name: get_state
    description: "Read the current screen: start, search results or an open command with its visible sections."
    ref_prompt: "What is the Linux command library showing?"
    params: []
    steps:
      - subroutine: open_app
      - python_action: "helpers:get_state"
    end_state_validator:
      all_of:
        - {kind: custom_python, function: "helpers:state_read"}
    test_case:
      ref_prompt_variants:
        - "which command page is open"
      expected_success: true
