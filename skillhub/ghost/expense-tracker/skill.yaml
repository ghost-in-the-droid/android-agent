# Ghost in the Droid: My Expenses (login-free FOSS seed skill, installed from F-Droid)
# Local expense tracker: add expenses and income, list transactions, read totals. Offline, no sync account.

name: expense-tracker
version: 1.0.0
author: ghost
description: "My Expenses (F-Droid): add an expense or income to the local Budget Book, list the transactions, read balance/income/expenses totals. Local only, no account."
skill_class: hard
license: MIT
generated_with: "Claude Sonnet 5.5 via Claude Code, hand-explored on a real Samsung phone"
side_effects: [none]
destructive: false
tos_risk: low
locale: [en-GB]
data_access: []

fingerprint:
  os: android
  os_version: ">=13"
  hardware: "*"
  app_package: org.totschnig.myexpenses
  app_version: ">=4.1.3"
  screen_wxh: 720x1600
  density: 300
  locale: en-GB

repo_url: "https://github.com/ghost-in-the-droid/android-agent"
skill_path: "skillhub/ghost/expense-tracker"

popup_detectors: []

subroutines:
  - name: open_list
    description: "Launch the app on the transaction list (first run: onboarding slides are clicked through)."
    steps:
      - {action: launch_app, package: org.totschnig.myexpenses}
      - {action: sleep, duration_s: 2.5}
      - python_action: "helpers:to_list"

actions:
  - name: add_expense
    description: "Add an expense (amount, optional payee and note) to the local Budget Book; returns the totals before and after."
    ref_prompt: "Add an expense of 12.50 at the bakery for lunch"
    demo_params: {amount: "12.50", payee: Bakery, note: lunch}
    params:
      - {name: amount, type: str, required: true, description: "Positive amount, e.g. 12.50"}
      - {name: payee, type: str, default: "", description: "Who was paid"}
      - {name: note, type: str, default: "", description: "Short note"}
    steps:
      - subroutine: open_list
      - python_action: "helpers:add_expense"
    end_state_validator:
      all_of:
        - {kind: element_present, desc: "New Transaction (Expense)"}
        - {kind: text_visible, text: "Budget Book"}
        - {kind: custom_python, function: "helpers:added"}
    test_case:
      ref_prompt_variants:
        - "log 4.20 for coffee"
        - "I spent 30 euros on groceries at Lidl"
        - "record an expense of 8"
      expected_success: true

  - name: add_income
    description: "Add an income (amount, optional payee and note); returns the totals before and after."
    ref_prompt: "Add an income of 100 from a client for a design job"
    demo_params: {amount: "100", payee: Client, note: design}
    params:
      - {name: amount, type: str, required: true, description: "Positive amount"}
      - {name: payee, type: str, default: "", description: "Who paid"}
      - {name: note, type: str, default: "", description: "Short note"}
    steps:
      - subroutine: open_list
      - python_action: "helpers:add_income"
    end_state_validator:
      all_of:
        - {kind: element_present, desc: "New Transaction (Expense)"}
        - {kind: text_visible, text: "Budget Book"}
        - {kind: custom_python, function: "helpers:added"}
    test_case:
      ref_prompt_variants:
        - "I got paid 500"
        - "record 20 euros income from a gift"
      expected_success: true

  - name: list_transactions
    description: "Read the transactions on screen: note, payee, amount (negative = expense) and date, plus the totals."
    ref_prompt: "List my expenses"
    params: []
    steps:
      - subroutine: open_list
      - python_action: "helpers:list_tx"
    end_state_validator:
      all_of:
        - {kind: element_present, desc: "New Transaction (Expense)"}
        - {kind: text_visible, text: "Budget Book"}
        - {kind: custom_python, function: "helpers:listed"}
    test_case:
      ref_prompt_variants:
        - "what did I spend money on"
        - "show my recent transactions"
      expected_success: true

  - name: get_totals
    description: "Read the account balance and the income / expenses / transfers totals."
    ref_prompt: "How much have I spent?"
    params: []
    steps:
      - subroutine: open_list
      - python_action: "helpers:totals"
    end_state_validator:
      all_of:
        - {kind: element_present, desc: "New Transaction (Expense)"}
        - {kind: text_visible, text: "Budget Book"}
        - {kind: custom_python, function: "helpers:totals_read"}
    test_case:
      ref_prompt_variants:
        - "what is my balance"
        - "total expenses"
      expected_success: true
