    expected_success: true
- name: add_feed
  description: Discover and add a public HTTPS RSS feed to the local app
  ref_prompt: Discover and add a public HTTPS RSS feed to the local app
  params:
  - name: feed_url
    type: str
    description: Public HTTPS URL, plain ASCII path; no credentials/query/fragment/IP
    required: true
  steps:
