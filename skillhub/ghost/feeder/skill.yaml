name: feeder
version: 1.0.0
author: ghost
description: Read public RSS news in Feeder without an account. Add a public HTTPS
  feed, list visible previews and read stored RSS article text through an explicit
  native-reader route; no external browser or posting.
skill_class: hard
license: MIT
generated_with: Codex, explored and replayed on Samsung SM-A156B Android 16
status: active
side_effects:
- none
destructive: false
tos_risk: low
locale:
- en-US
