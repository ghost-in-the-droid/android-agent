name: glider
version: 1.0.0
author: ghost
description: Read public Hacker News stories and comments anonymously in Glider. Browse
  categories, list story titles/points/comment counts and read visible discussion
  text without accounts or engagement.
skill_class: hard
license: MIT
generated_with: Codex, explored and replayed on Samsung SM-A156B Android 16
status: active
side_effects:
- none
destructive: false
tos_risk: low
locale:
- en-US
data_access:
- network
fingerprint:
  os: android
  os_version: '16'
  hardware: samsung/SM-A156B
  app_package: nl.viter.glider
  app_version: '>=2.8.0,<2.9'
  screen_wxh: 1080x2340
  density: 450
repo_url: https://github.com/ghost-in-the-droid/android-agent
skill_path: skillhub/ghost/glider
actions:
- name: open
  description: Open the anonymous Hacker News frontpage
  ref_prompt: Open the anonymous Hacker News frontpage
  params: []
  steps:
  - python_action: helpers:open_app
  end_state_validator:
    all_of:
    - kind: custom_python
      function: helpers:stories_ok
  test_case:
    ref_prompt_variants:
    - Open the anonymous Hacker News frontpage in glider
    expected_success: true
- name: read_stories
  description: List complete visible stories with points and comment counts
  ref_prompt: List complete visible stories with points and comment counts
  params: []
  steps:
