  end_state_validator:
    all_of:
    - kind: custom_python
      function: helpers:stories_ok
  test_case:
    ref_prompt_variants:
    - List complete visible stories with points and comment counts in glider
    expected_success: true
- name: select_category
  description: Select a public frontpage story category
  ref_prompt: Select a public frontpage story category
  params:
  - name: category
    type: enum
    values:
    - Top
    - New
    - Best
    - Ask
    - Show
    required: true
  steps:
  - python_action: helpers:select_category
  end_state_validator:
    all_of:
    - kind: custom_python
      function: helpers:stories_ok
  test_case:
    ref_prompt_variants:
    - Select a public frontpage story category in glider
    expected_success: true
- name: open_comments
